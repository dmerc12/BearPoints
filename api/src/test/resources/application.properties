# ==================
# APPLICATION CONFIG
# ==================
spring.application.name=api

# ========================================
# HEALTH ENDPOINT WITH DB CONNECTION CHECK
# ========================================
management.endpoint.health.access=read_only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ===============
# DATABASE CONFIG
# ===============
# H2 Configuration
# Test-specific DB configuration
#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable production DB initialization in tests
spring.sql.init.mode=never

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ====================
# GOOGLE SHEETS CONFIG
# ====================
# Path to google sheets service account JSON file
google.service.account.key=${GOOGLE_SERVICE_ACCOUNT_KEY}
# ID of the Google Sheet
google.sheets.spreadsheet.id=${GOOGLE_SHEET_ID}

# ===============
# FIREBASE CONFIG
# ===============
# Path to firebase service account JSON file
firebase.credentials.json=${FIREBASE_SERVICE_ACCOUNT_KEY}

# ==============
# LOGGING CONFIG
# ==============
logging.level.root=INFO
logging.level.com.bearpoints.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.hibernate.orm.jdbc.extract=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/application.log
# Logback rolling policy
logging.logback.rollingpolicy.file-name-pattern=logs/application.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=1GB

# =================
# SPRINGDOC OPENAPI
# =================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# =============
# SERVER CONFIG
# =============
server.port=${PORT:8080}
server.servlet.context-path=/
spring.data.rest.base-path=/api

# ==============
# RAILWAY CONFIG
# ==============
# Optimize JVM for faster startup
spring.main.lazy-initialization=true
spring.main.web-application-type=servlet
spring.jmx.enabled=false

# Connection management
server.tomcat.connection-timeout=15s
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=58000
