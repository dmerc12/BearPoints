# ==================
# APPLICATION CONFIG
# ==================
spring.application.name=api

# ====================================
# EXPOSE HEALTH ENDPOINT WITH DB CHECK
# ====================================
management.endpoint.health.access=read_only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ===============
# DATABASE CONFIG
# ===============
# PostgreSQL Configuration (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====================
# GOOGLE SHEETS CONFIG
# ====================
google.service.account.key=${GOOGLE_SERVICE_ACCOUNT_KEY}
google.sheets.spreadsheet.id=${GOOGLE_SHEET_ID}

# ===============
# FIREBASE CONFIG
# ===============
firebase.credentials.json=${FIREBASE_SERVICE_ACCOUNT_KEY}

# ==============
# LOGGING CONFIG
# ==============
logging.level.root=INFO
logging.level.com.bearpoints.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# =================
# SPRINGDOC OPENAPI
# =================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# =============
# SERVER CONFIG
# =============
server.port=8080
server.servlet.context-path=/
spring.data.rest.base-path=/api

# ==============
# RAILWAY CONFIG
# ==============
# Optimize JVM for faster startup
spring.main.lazy-initialization=true
spring.main.web-application-type=servlet
spring.jmx.enabled=false

# Connection management
server.tomcat.connection-timeout=15s
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=58000
