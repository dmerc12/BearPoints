# ==================
# APPLICATION CONFIG
# ==================
spring.application.name=api

# ===============
# DATABASE CONFIG
# ===============
# H2 Configuration (Development)
spring.datasource.url=jdbc:h2:mem:bearpointsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=example
spring.datasource.password=example
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Configuration (Production)
#spring.datasource.url=jdbc:postgresql://localhost:5432/bearpoints
#spring.datasource.username=example
#spring.datasource.password=example
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====================
# GOOGLE SHEETS CONFIG
# ====================
google.service.account.key=${GOOGLE_SERVICE_ACCOUNT_KEY}
google.sheets.spreadsheet.id=${GOOGLE_SHEET_ID}

# ==============
# LOGGING CONFIG
# ==============
logging.level.root=INFO
logging.level.com.bearpoints.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# =================
# SPRINGDOC OPENAPI
# =================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# =============
# SERVER CONFIG
# =============
server.port=8080
server.servlet.context-path=/api
